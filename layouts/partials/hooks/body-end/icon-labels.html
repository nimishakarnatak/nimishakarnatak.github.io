<style>
  #nk-icon-tooltip {
    position: fixed;
    z-index: 1080;
    width: max-content;
    max-width: calc(100vw - 24px);
    box-sizing: border-box;
    padding: 8px 12px;
    border-radius: 6px;
    background: #20252b;
    color: #ffffff;
    box-shadow: 0 3px 12px rgba(0, 0, 0, 0.12);
    font: 400 13px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
    text-align: center;
    white-space: normal;
    overflow-wrap: break-word;
  }
  #nk-icon-tooltip[hidden] { display: none !important; }
  body.dark #nk-icon-tooltip { background: #edf0f3; color: #20252b; }
</style>

<script>
(function () {
  const labels = {
    '.fa-envelope': 'Email me',
    '.fa-twitter': 'X (Twitter) profile',
    '.fa-linkedin': 'LinkedIn profile',
    '.ai-google-scholar': 'Google Scholar profile',
    '.ai-cv': 'View CV',
    '.fa-university': 'University of Oxford profile'
  };

  function addIconLabels() {
    if (document.getElementById('nk-icon-tooltip')) return;

    const tooltip = document.createElement('div');
    tooltip.id = 'nk-icon-tooltip';
    tooltip.hidden = true;
    // Each link has the same text as its accessible name.
    tooltip.setAttribute('aria-hidden', 'true');
    document.body.appendChild(tooltip);

    let activeLink = null;
    let hideTimer;

    function cancelHide() {
      window.clearTimeout(hideTimer);
    }

    function hide() {
      cancelHide();
      tooltip.hidden = true;
      activeLink = null;
    }

    function show(link, label) {
      cancelHide();
      activeLink = link;
      tooltip.textContent = label;
      tooltip.hidden = false;

      const iconBox = link.getBoundingClientRect();
      const tipBox = tooltip.getBoundingClientRect();
      const viewWidth = document.documentElement.clientWidth;
      const viewHeight = document.documentElement.clientHeight;
      const left = Math.max(12, Math.min(
        iconBox.left + iconBox.width / 2 - tipBox.width / 2,
        viewWidth - tipBox.width - 12
      ));
      let top = iconBox.bottom + 8;
      if (top + tipBox.height > viewHeight - 12) {
        top = Math.max(12, iconBox.top - tipBox.height - 8);
      }
      tooltip.style.left = left + 'px';
      tooltip.style.top = top + 'px';
    }

    function hideAfterLeaving() {
      cancelHide();
      // A short exit grace period lets the pointer reach the label.
      // Showing a label has no delay.
      hideTimer = window.setTimeout(function () {
        if (activeLink && document.activeElement === activeLink) return;
        hide();
      }, 100);
    }

    document.querySelectorAll('.network-icon a').forEach(function (link) {
      for (const [selector, label] of Object.entries(labels)) {
        const icon = link.querySelector(selector);
        if (!icon) continue;

        // Empty title suppresses the browser's delayed native tooltip.
        link.setAttribute('title', '');
        link.querySelectorAll('[title]').forEach(function (child) {
          child.setAttribute('title', '');
        });
        link.setAttribute('aria-label', label);
        icon.setAttribute('aria-hidden', 'true');
        link.closest('.network-icon').removeAttribute('aria-hidden');

        link.addEventListener('pointerenter', function (event) {
          if (event.pointerType !== 'touch') show(link, label);
        });
        link.addEventListener('pointerleave', function () {
          if (activeLink === link) hideAfterLeaving();
        });
        link.addEventListener('focus', function () { show(link, label); });
        link.addEventListener('blur', function () {
          if (activeLink === link) hideAfterLeaving();
        });
        break;
      }
    });

    tooltip.addEventListener('pointerenter', cancelHide);
    tooltip.addEventListener('pointerleave', hideAfterLeaving);
    document.addEventListener('keydown', function (event) {
      if (event.key === 'Escape') hide();
    });
    document.addEventListener('click', hide);
    window.addEventListener('scroll', hide, { capture: true, passive: true });
    window.addEventListener('resize', hide);
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', addIconLabels, { once: true });
  } else {
    addIconLabels();
  }
})();
</script>
